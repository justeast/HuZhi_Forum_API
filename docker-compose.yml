services:
  # 1. Django 后端服务
  web:
    build: .
    container_name: huzhi_backend
    restart: always
    # 启动顺序：先等 db 和 redis 起来，再执行迁移，最后启动 daphne
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py collectstatic --noinput &&
             uv run daphne -b 0.0.0.0 -p 8013 config.asgi:application"
    volumes:
      - static_volume:/app/static_root  # 映射静态文件给 Nginx
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - huzhi_net

  # 2. MySQL 数据库
  db:
    image: mysql:8.0
    container_name: huzhi_db
    restart: always
    # 关键优化：限制 buffer pool 为 256MB，防止撑爆 2G 内存
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${HUZHI_MYSQL_NAME}
      # 以下两个是用来设置非root的普通用户的
      # MYSQL_USER: ${HUZHI_MYSQL_USER}
      # MYSQL_PASSWORD: ${HUZHI_MYSQL_PASSWORD}
      # 若使用root用户只需设置这个即可
      MYSQL_ROOT_PASSWORD: ${HUZHI_MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - huzhi_net
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    # Docker 资源限制 (双重保险)
    deploy:
      resources:
        limits:
          memory: 800M

  # 3. Redis 服务
  redis:
    image: redis:alpine
    container_name: huzhi_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - huzhi_net

  # 4. Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: huzhi_nginx
    restart: always
    ports:
      - "80:80"  # 暴露 HTTP 端口
    volumes:
      # 挂载我们自定义的 nginx 配置文件
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # 挂载静态资源（来自 web 容器）
      - static_volume:/app/static_root
    depends_on:
      - web
    networks:
      - huzhi_net

# 定义数据卷 (持久化存储)
volumes:
  db_data:
  redis_data:
  static_volume:

# 定义网络
networks:
  huzhi_net:
    driver: bridge